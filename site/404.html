<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada · JARVIS</title>
  <meta name="theme-color" content="#0D3170" />
  <link rel="icon" type="image/svg+xml" href="/assets/brand/avatar.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --core: #22d3ee; --text: #e6f7fb; --muted: #a9c6d6; --line: rgba(200, 235, 255, 0.28); }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; text-align: center;
      color: var(--text); font: 400 17px/1.6 "Inter", system-ui, sans-serif;
      background-color: #0d3170;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.075) 1px, transparent 1px),
        radial-gradient(ellipse at 50% 30%, #2362b8 0%, #174a95 45%, #0d3170 100%);
      background-size: 100px 100px, 100px 100px, 100% 100%;
    }
    main { max-width: 520px; }
    .code { font: 700 clamp(56px, 16vw, 110px)/1 "Orbitron", sans-serif; letter-spacing: 8px; text-shadow: 0 0 30px rgba(34, 211, 238, 0.45); }
    h1 { font: 700 20px "Orbitron", sans-serif; letter-spacing: 3px; text-transform: uppercase; color: var(--core); }
    p { color: var(--muted); }
    a { display: inline-block; margin-top: 12px; padding: 12px 22px; border-radius: 10px; background: var(--core); color: #04163a; font: 700 15px "Rajdhani", sans-serif; letter-spacing: 1.8px; text-transform: uppercase; text-decoration: none; }
    a:focus-visible { outline: 2px solid #f59e0b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>Procurei em toda a planta, senhor, e esta página não está aqui.</p>
    <a href="/">Voltar ao início</a>
  </main>
</body>
</html>
