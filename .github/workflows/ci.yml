name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend e scripts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependências do backend
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check .
        working-directory: backend

      - name: Testes do backend e scripts
        # V8.11: -v mostra cada teste (PASSED/FAILED) na hora: no Windows o relatório final às vezes não sai
        run: pytest -v --tb=short -p no:cacheprovider backend/tests scripts/tests
        env:
          # V8.11: saída do pytest em UTF-8. No Windows ela era cp1252: acentos viravam "�" e um caractere fora do
          # cp1252 derrubava o pytest no meio do relatório (sem a lista de falhas no fim).
          PYTHONIOENCODING: utf-8

  frontend:
    name: Frontend
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          # V8.11: o "npm test" usa glob no node --test ("tests/**/*.test.js"), que só existe a partir do Node 21
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: Testes
        run: npm test
        working-directory: frontend

      - name: Build de produção
        run: npm run build
        working-directory: frontend
