# Site do JARVIS no Netlify: a vitrine (site/) e, em /app/, a própria central do JARVIS (frontend/).
# A central publicada aqui é a mesma do PC e conversa com o backend que roda no PC (127.0.0.1:8000).
# V6.6: com o notebook desligado, a central usa o MODO NUVEM: funções do Netlify em /api/cloud/*
# (netlify/functions/nuvem.mjs) com os dados no Netlify Blobs. Configuração em docs/MODO-NUVEM.md.
# O script monta a pasta _site/ a partir de site/, das imagens de docs/, da marca, do Branding Book e do frontend.

[build]
  command = "bash scripts/netlify/montar_site.sh"
  publish = "_site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Endereços curtos
[[redirects]]
  from = "/branding"
  to = "/branding-book.html"
  status = 301

[[redirects]]
  from = "/github"
  to = "https://github.com/PatrickCaramico/IA_Jarvis"
  status = 302

[[redirects]]
  from = "/android"
  to = "https://github.com/PatrickCaramico/IA_Jarvis/releases/latest"
  status = 302

# A central do JARVIS: /app abre a central; a tela secundária (/app/display) também cai no index
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# V6.7.6: arquivo antigo da central (de antes de uma atualização) responde 404, e não a página da central:
# antes, o navegador recebia o HTML no lugar do código e a tela ficava preta
[[redirects]]
  from = "/app/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Segurança básica
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # V7.2: SAMEORIGIN (antes DENY) para o 📘 Branding Book abrir dentro da central; outros sites continuam sem poder
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Microfone (voz, palmas, Sentinela); V7.2: câmera do celular ("abre a câmera e analisa", também fora de casa)
    # e localização ("ONDE ESTOU" no mapa de trânsito do Olho de Deus, inclusive dentro do mapa do Waze)
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self \"https://embed.waze.com\")"

# Imagens e ícones mudam pouco: cache de um dia
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Arquivos da central com hash no nome: cache longo
[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
