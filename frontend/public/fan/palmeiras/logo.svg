<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="greenGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#008044"/>
      <stop offset="100%" stop-color="#00522c"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#19a35f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Círculo externo Verde -->
  <circle cx="250" cy="250" r="240" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="8"/>

  <!-- Anel Branco -->
  <circle cx="250" cy="250" r="216" fill="none" stroke="#ffffff" stroke-width="28"/>

  <!-- 8 Estrelas no anel -->
  <!-- Superior central -->
  <g fill="#006437">
    <!-- Ângulos aproximados das 8 estrelas históricas -->
    <!-- Estrela 1 (topo) -->
    <polygon points="250,38 253,46 261,46 255,51 257,59 250,54 243,59 245,51 239,46 247,46"/>
    <!-- Estrela 2 (45 graus) -->
    <polygon points="398,102 399,110 407,112 400,116 401,124 395,118 389,122 392,115 387,109 395,110" transform="rotate(45 250 250)"/>
    <!-- Estrela 3 (90 graus) -->
    <polygon points="462,250 454,253 454,261 449,255 441,257 446,250 441,243 449,245 454,239 454,247" transform="rotate(90 250 250)"/>
    <!-- Estrela 4 (135 graus) -->
    <polygon points="398,398 392,395 387,401 389,395 385,389 393,390 395,382 399,390 407,392 400,396" transform="rotate(135 250 250)"/>
    <!-- Estrela 5 (180 graus) -->
    <polygon points="250,462 247,454 239,454 245,449 243,441 250,446 257,441 255,449 261,454 253,454" transform="rotate(180 250 250)"/>
    <!-- Estrela 6 (225 graus) -->
    <polygon points="102,398 110,399 112,407 116,400 124,401 118,395 122,389 115,392 109,387 110,395" transform="rotate(225 250 250)"/>
    <!-- Estrela 7 (270 graus) -->
    <polygon points="38,250 46,247 46,239 51,245 59,243 54,250 59,257 51,255 46,261 46,253" transform="rotate(270 250 250)"/>
    <!-- Estrela 8 (315 graus) -->
    <polygon points="102,102 108,105 113,99 111,105 115,111 107,110 105,118 101,110 93,108 100,104" transform="rotate(315 250 250)"/>
  </g>

  <!-- Círculo Interno Verde -->
  <circle cx="250" cy="250" r="198" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="5"/>

  <!-- Faixas / Raios internos do escudo (26 raios característicos) -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.45">
    <line x1="250" y1="52" x2="250" y2="448"/>
    <line x1="110" y1="110" x2="390" y2="390"/>
    <line x1="52" y1="250" x2="448" y2="250"/>
    <line x1="110" y1="390" x2="390" y2="110"/>
    <line x1="175" y1="70" x2="325" y2="430"/>
    <line x1="70" y1="175" x2="430" y2="325"/>
    <line x1="70" y1="325" x2="430" y2="175"/>
    <line x1="175" y1="430" x2="325" y2="70"/>
  </g>

  <!-- Escudo interno clássico tipo sino/heráldico com o 'P' -->
  <g filter="url(#glow)">
    <path d="M200,140 Q250,130 300,140 Q315,220 295,290 Q270,350 250,375 Q230,350 205,290 Q185,220 200,140 Z"
          fill="#ffffff" stroke="#006437" stroke-width="4"/>
    
    <!-- Letra 'P' estilizada no centro do escudo -->
    <path d="M232,180 L258,180 Q278,180 278,206 Q278,232 258,232 L246,232 L246,315 L232,315 Z M246,194 L246,218 L256,218 Q264,218 264,206 Q264,194 256,194 Z"
          fill="#006437"/>
  </g>
</svg>
